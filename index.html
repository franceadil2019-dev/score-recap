                    if (match.fixture.status.short === 'FT') {
                        if (String(league.id) === '39') { customSection = `<button class="article-btn w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold mt-4 shadow-sm transition-colors" data-fixture-id="${fId}" data-league-id="${league.id}">${currentT.readReportBtn}</button><div id="ai-article-${fId}" class="hidden"></div>`; } 
                        else { customSection = `<div class="text-center text-[10px] text-slate-400 py-3 mt-4 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 border-dashed">${currentT.reportExclusive}</div>`; }
                    } else if (notStarted) {
                        if (String(league.id) === '39') {
                            const winHomeText = `${currentT.win} ${match.teams.home.name}`; const drawText = currentT.draw; const winAwayText = `${currentT.win} ${match.teams.away.name}`;
                            const savedVote = localStorage.getItem(`vote_${fId}`) || "";
                            customSection = `<div class="mt-4 p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3" onclick="event.stopPropagation()"><div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end order-2 sm:order-1"><span class="text-xs font-bold sm:text-right flex-grow">${match.teams.home.name}</span><img src="${match.teams.home.logo}" class="w-6 h-6 object-contain"></div><div class="w-full sm:w-1/3 order-1 sm:order-2"><select class="vote-select w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 text-xs rounded-lg py-2.5 px-3 text-center focus:outline-none focus:border-emerald-500 font-bold text-slate-700 dark:text-slate-300 transition-colors cursor-pointer" data-fixture-id="${fId}"><option value="" disabled ${!savedVote ? 'selected' : ''}>${currentT.predictVote}</option><option value="home" ${savedVote === 'home' ? 'selected' : ''}>${winHomeText}</option><option value="draw" ${savedVote === 'draw' ? 'selected' : ''}>${drawText}</option><option value="away" ${savedVote === 'away' ? 'selected' : ''}>${winAwayText}</option></select></div><div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start order-3"><img src="${match.teams.away.logo}" class="w-6 h-6 object-contain"><span class="text-xs font-bold sm:text-left flex-grow">${match.teams.away.name}</span></div></div><button class="predict-btn w-full bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white py-2.5 rounded-lg text-xs font-bold mt-3 shadow-sm transition-colors" data-fixture-id="${fId}" data-league-id="${league.id}" data-home="${match.teams.home.name}" data-away="${match.teams.away.name}">${currentT.predictBtn}</button><div id="predict-box-${fId}" class="hidden"></div>`;
                        } else { customSection = `<div class="text-center text-[10px] text-slate-400 py-3 mt-4 bg-slate-50 dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 border-dashed">${currentT.reportExclusive}</div>`; }
                    }

                    const formatStr = str => str.replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase(); const matchSlug = `${formatStr(match.teams.home.name)}-vs-${formatStr(match.teams.away.name)}`; const matchUrl = `/match/${fId}/${matchSlug}`;

                    html += `<div class="match-row-container group" data-fixture-id="${fId}">
                            <a href="${matchUrl}" class="match-row-header block p-3 md:p-4 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors" data-fixture-id="${fId}">
                                <div class="flex justify-between items-center"><div class="w-1/3 text-right font-bold text-sm text-slate-700 dark:text-slate-200 flex flex-col md:flex-row items-end md:items-center justify-end gap-2"><span class="hidden md:inline">${match.teams.home.name}</span><img src="${match.teams.home.logo}" class="w-6 h-6"></div><div class="w-1/3 text-center flex flex-col items-center"><div class="text-[10px] text-slate-400 mb-1 font-semibold tracking-wider">${statusText}</div><div class="bg-slate-100 dark:bg-slate-950 px-3 py-1 rounded-md text-slate-800 dark:text-slate-100 font-black text-lg shadow-sm border border-slate-200 dark:border-slate-800/50">${hScore} - ${aScore}</div></div><div class="w-1/3 text-left font-bold text-sm text-slate-700 dark:text-slate-200 flex flex-col md:flex-row items-start md:items-center justify-start gap-2"><img src="${match.teams.away.logo}" class="w-6 h-6"><span class="hidden md:inline">${match.teams.away.name}</span></div></div></a>
                            <div id="details-${fId}" class="hidden px-4 pb-5 pt-2 bg-slate-50 dark:bg-slate-800/20 border-t border-slate-100 dark:border-slate-800"><div class="max-w-2xl mx-auto mt-2"><div class="flex justify-between items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-4 shadow-sm mb-4"><div class="text-center w-1/3"><img src="${match.teams.home.logo}" class="w-12 h-12 mx-auto mb-2 drop-shadow-sm"><div class="font-bold text-sm dark:text-white">${match.teams.home.name}</div></div><div class="w-1/3 text-center"><div class="inline-block bg-slate-100 dark:bg-slate-950 border-2 border-emerald-500/30 rounded-xl px-5 py-2 text-3xl font-black text-slate-800 dark:text-white shadow-inner mb-1">${hScore} - ${aScore}</div></div><div class="text-center w-1/3"><img src="${match.teams.away.logo}" class="w-12 h-12 mx-auto mb-2 drop-shadow-sm"><div class="font-bold text-sm dark:text-white">${match.teams.away.name}</div></div></div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 shadow-sm"><div class="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider border-b border-slate-100 dark:border-slate-800 pb-2">Match Events</div><div id="events-list-${fId}" class="min-h-[60px]"></div></div>
                                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm flex flex-col justify-center space-y-4"><div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center">${currentT.statsTitle}</div><div><div class="flex justify-between text-[11px] mb-1.5 font-bold"><span id="poss-home-val-${fId}" class="text-emerald-500">-</span><span class="text-slate-500">${currentT.poss}</span><span id="poss-away-val-${fId}" class="text-blue-500">-</span></div><div class="flex h-2 rounded-full overflow-hidden bg-slate-100 dark:bg-slate-800"><div id="poss-home-bar-${fId}" class="bg-emerald-500 transition-all duration-1000 w-[50%]"></div><div id="poss-away-bar-${fId}" class="bg-blue-500 transition-all duration-1000 w-[50%]"></div></div></div><div><div class="flex justify-between text-[11px] mb-1.5 font-bold"><span id="shots-home-val-${fId}" class="text-emerald-500">-</span><span class="text-slate-500">${currentT.shots}</span><span id="shots-away-val-${fId}" class="text-blue-500">-</span></div><div class="flex h-2 rounded-full overflow-hidden bg-slate-100 dark:bg-slate-800"><div id="shots-home-bar-${fId}" class="bg-emerald-500 transition-all duration-1000 w-[50%]"></div><div id="shots-away-bar-${fId}" class="bg-blue-500 transition-all duration-1000 w-[50%]"></div></div></div></div></div>
                                    ${customSection}
                                </div></div></div>`;
                }); 
                finalHTML += html + `</div></div>`;
            });
            
            container.innerHTML = finalHTML; 
            handleRoute();
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme(); fetchLiveMatches(); setInterval(() => fetchLiveMatches(false), APP_CONFIG.autoRefreshInterval);
            document.querySelectorAll('.date-tab').forEach(btn => { btn.addEventListener('click', (e) => { document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('date-tab-active')); e.currentTarget.classList.add('date-tab-active'); currentDateOffset = parseInt(e.currentTarget.getAttribute('data-offset')); allMatchesCached = []; fetchLiveMatches(true); }); });
            const searchInput = document.getElementById('search-input'); if (searchInput) { searchInput.addEventListener('input', (e) => { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { currentSearchQuery = e.target.value.trim(); filterAndRenderMatches(); }, 300); }); }
            document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme); document.getElementById('btn-refresh').addEventListener('click', () => { allMatchesCached = []; fetchLiveMatches(true); });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-dropdown')) {
                    document.querySelectorAll('.drop-options').forEach(d => d.classList.remove('show'));
                }
            });

            document.getElementById('btn-lang-dropdown').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown('lang-options-menu'); });
            
            // ✅ الإصلاح هنا: استخدام الرابط المباشر من data-flag بدلاً من إضافة الرابط مرتين
            document.querySelectorAll('.lang-opt').forEach(btn => { 
                btn.addEventListener('click', () => { 
                    document.getElementById('current-lang-flag').src = btn.getAttribute('data-flag'); 
                    document.getElementById('current-lang-text').innerText = btn.getAttribute('data-name'); 
                    changeLanguage(btn.getAttribute('data-lang')); 
                    document.getElementById('lang-options-menu').classList.remove('show');
                }); 
            });
            
            document.getElementById('btn-league-dropdown').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown('league-options-menu'); });
            document.querySelectorAll('.league-opt').forEach(btn => { 
                btn.addEventListener('click', () => { 
                    selectedLeagueId = btn.getAttribute('data-id'); 
                    document.getElementById('current-league-flag').src = btn.getAttribute('data-flag'); 
                    selectedLeagueTranslationKey = btn.getAttribute('data-key'); 
                    const t = translations[currentLang] || translations['en']; 
                    document.getElementById('current-league-text').innerText = t[selectedLeagueTranslationKey] || t['allLeagues']; 
                    filterAndRenderMatches(); 
                    document.getElementById('league-options-menu').classList.remove('show');
                }); 
            });
            
            document.getElementById('api-scores-container').addEventListener('change', (e) => { if (e.target.classList.contains('vote-select')) { const fId = e.target.getAttribute('data-fixture-id'); const vote = e.target.value; localStorage.setItem(`vote_${fId}`, vote); showToast(translations[currentLang].voteSaved, 'success'); } });

            document.getElementById('api-scores-container').addEventListener('click', (e) => { 
                if (e.target.closest('.predict-btn')) { const btn = e.target.closest('.predict-btn'); loadPrediction(btn.getAttribute('data-fixture-id'), btn.getAttribute('data-league-id'), btn.getAttribute('data-home'), btn.getAttribute('data-away'), btn); return; }
                if (e.target.closest('.article-btn')) { const btn = e.target.closest('.article-btn'); loadMatchArticle(btn.getAttribute('data-fixture-id'), btn.getAttribute('data-league-id'), btn); return; }
                const link = e.target.closest('a.match-row-header'); if (link) { e.preventDefault(); const fId = link.getAttribute('data-fixture-id'); const href = link.getAttribute('href'); if (window.location.pathname !== href) { history.pushState(null, '', href); } const details = document.getElementById(`details-${fId}`); if (details && !details.classList.contains('hidden')) { details.classList.add('hidden'); history.pushState(null, '', '/'); handleRoute(); } else { openMatch(fId); } } 
            });
            const logoLink = document.getElementById('logo-link'); if(logoLink) { logoLink.addEventListener('click', (e) => { e.preventDefault(); history.pushState(null, '', '/'); handleRoute(); }); }
            window.addEventListener('popstate', handleRoute);
        });
    </script>
</body>
</html>
